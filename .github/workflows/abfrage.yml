name: Abfrage
# Takt: Jeder Lauf plant am Ende den naechsten ein. Der wartet in der Umgebung "takt"
# (13 Minuten Wartezeit, kostet keine Rechenzeit) und fragt dann ab. So kommt der Bot
# zuverlaessig alle ~15 Minuten vorbei, auch wenn der GitHub-Zeitplan hakt.
# Der Zeitplan unten bleibt als Reserve, falls die Kette einmal abreisst.
# Anhalten: Repository-Variable TAKT auf "aus" setzen.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      warten:
        description: 'Vorher warten (Takt)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: abfrage
  cancel-in-progress: false
jobs:
  takt:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.warten }}
    runs-on: ubuntu-latest
    environment: takt
    steps:
      - run: echo "Wartezeit vorbei"
  abfrage:
    needs: takt
    if: ${{ !cancelled() && needs.takt.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bot fragt ab (nur kurz auf dem Server)
        env:
          KS_SERVER: ${{ secrets.KS_SERVER }}
          KS_AUTH_SCHLUESSEL: ${{ secrets.KS_AUTH_SCHLUESSEL }}
          KS_DATEN_SCHLUESSEL: ${{ secrets.KS_DATEN_SCHLUESSEL }}
        run: ./gradlew -q installDist && ./build/install/mcstats/bin/mcstats abfrage 2>&1 | grep -vE 'SLF4J|INFO|WARNING' || true
      - name: Ergebnis speichern
        run: |
          git config user.name "statsbot"
          git config user.email "statsbot@users.noreply.github.com"
          git add docs/daten.enc auth.enc
          if ! git diff --cached --quiet; then
            git commit -q -m "Daten aktualisiert"
            git pull -q --rebase && git push -q
          fi
      - name: Naechsten Besuch einplanen
        if: ${{ !cancelled() && vars.TAKT != 'aus' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run abfrage.yml -R "$GITHUB_REPOSITORY" --ref main -f warten=true
