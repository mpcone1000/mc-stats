name: Abfrage
on:
  # schedule:
    # - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: abfrage
  cancel-in-progress: false
jobs:
  abfrage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bot fragt ab (max. 10 Sekunden auf dem Server)
        env:
          KS_SERVER: ${{ secrets.KS_SERVER }}
          KS_AUTH_SCHLUESSEL: ${{ secrets.KS_AUTH_SCHLUESSEL }}
          KS_DATEN_SCHLUESSEL: ${{ secrets.KS_DATEN_SCHLUESSEL }}
        run: ./gradlew -q installDist && ./build/install/mcstats/bin/mcstats abfrage 2>&1 | grep -vE 'SLF4J|INFO' || true
      - name: Ergebnis speichern
        run: |
          git config user.name "statsbot"
          git config user.email "statsbot@users.noreply.github.com"
          git add docs/daten.enc auth.enc
          git diff --cached --quiet || (git commit -q -m "Daten aktualisiert" && git push -q)
