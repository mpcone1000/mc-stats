<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101418">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>MC-Stats</title>
<style>
:root {
  --bg: #f2f4f7; --panel: rgba(255,255,255,.86); --panel2: #f4f6fa; --text: #121926; --muted: #667085; --line: rgba(16,24,40,.08);
  --accent: #1f9d55; --accent2: #16a34a; --gold: #c2850c; --plus: #16a34a; --minus: #dc2626; --warn: #d97706;
  --s1: #16a34a; --s2: #2563eb; --s3: #d97706; --s4: #9333ea; --s5: #e11d48;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px -8px rgba(16,24,40,.12); --radius: 20px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #07090d; --panel: rgba(22,27,36,.82); --panel2: #1a2030; --text: #eef2f7; --muted: #8b95a8; --line: rgba(255,255,255,.07);
    --accent: #34d399; --accent2: #10b981; --gold: #fbbf24; --plus: #34d399; --minus: #f87171; --warn: #fbbf24;
    --s1: #34d399; --s2: #60a5fa; --s3: #fbbf24; --s4: #c084fc; --s5: #fb7185; --shadow: 0 8px 30px -12px rgba(0,0,0,.6); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; color: var(--text); background: var(--bg);
  font: 16px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
body { background: radial-gradient(1200px 500px at 50% -200px, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%), var(--bg); min-height: 100vh; }
header { position: sticky; top: 0; z-index: 5; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); }
.kopf { display: flex; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--accent2), var(--gold));
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 17px; box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
.kopf h1 { font-size: 19px; margin: 0; line-height: 1.1; letter-spacing: -.01em; }
.kopf .st { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.kopf button { margin-left: auto; width: 40px; height: 40px; padding: 0; font-size: 18px; }
main { max-width: 760px; margin: 0 auto; padding: 6px 16px calc(110px + env(safe-area-inset-bottom)); }
.rein { animation: rein .22s ease; }
@keyframes rein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
nav { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 6; display: flex; justify-content: center; }
nav .in { display: flex; width: 100%; max-width: 520px; padding: 6px; gap: 2px; border-radius: 24px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel2) 88%, transparent); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); box-shadow: var(--shadow); }
nav button { flex: 1; background: none; border: 0; color: var(--muted); padding: 7px 2px 6px; font: inherit; font-size: 11px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; border-radius: 18px; transition: background .2s, color .2s; }
nav button svg { width: 22px; height: 22px; }
nav button.aktiv { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.karte { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.held { position: relative; overflow: hidden; border: 0; color: #fff;
  background: radial-gradient(400px 200px at 100% 0%, rgba(251,191,36,.35), transparent 60%), linear-gradient(150deg, #0f5132, #14532d 45%, #1e293b); }
.held .t, .held .klein { color: rgba(255,255,255,.75); }
.held .gross { color: #fde68a; text-shadow: 0 2px 20px rgba(251,191,36,.35); }
.held .chip { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.14); color: #fff; }
.held .chip .plus { color: #86efac; } .held .chip .minus { color: #fca5a5; }
.held svg.graf text { fill: rgba(255,255,255,.6); }
.held .tip { color: rgba(255,255,255,.7); }
.t { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.gross { font-size: clamp(34px, 10vw, 48px); font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; margin: 6px 0 4px; }
.mittel { font-size: 22px; font-weight: 750; letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.klein { font-size: 13px; color: var(--muted); }
.raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.raster .karte { margin: 0; padding: 14px 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13.5px; font-weight: 600; }
.chip.gut { color: var(--plus); } .chip.schlecht { color: var(--minus); } .chip.warn { color: var(--warn); }
.plus { color: var(--plus); } .minus { color: var(--minus); } .warn { color: var(--warn); } .gold { color: var(--gold); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
td, th { padding: 10px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
td.z, th.z { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.ich td { background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 700; }
tr:last-child td { border-bottom: 0; }
.rang { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--panel2); font-weight: 800; font-size: 13px; }
.rang.r1 { background: linear-gradient(135deg, #fde68a, #f59e0b); color: #3d2e00; } .rang.r2 { background: linear-gradient(135deg, #f1f5f9, #94a3b8); color: #1e293b; }
.rang.r3 { background: linear-gradient(135deg, #fed7aa, #c2410c); color: #fff; }
.knoepfe { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
button.k, .knoepfe button { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 999px;
  padding: 7px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .1s; }
button.k:active, .knoepfe button:active, .aktion:active { transform: scale(.97); }
.knoepfe button.aktiv { background: var(--accent); border-color: var(--accent); color: #fff; }
.segment { display: flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 12px; }
.segment button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 700; font-size: 14px; padding: 8px; border-radius: 10px; cursor: pointer; }
.segment button.aktiv { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.balken { height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; margin-top: 6px; }
.balken > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 99px; }
.zeile { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.zeile:last-child { border-bottom: 0; }
.zeile b { font-variant-numeric: tabular-nums; }
svg.graf { width: 100%; height: auto; display: block; touch-action: pan-y; }
svg.graf text { fill: var(--muted); font-size: 11px; }
.tip { font-size: 13px; color: var(--muted); min-height: 19px; margin-top: 4px; }
.legende { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; margin-top: 6px; }
.legende span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; background: var(--f); }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 2px 0; font-weight: 600; }
.leer { color: var(--muted); font-size: 14px; }
.punkte { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin-top: 8px; }
.punkte i { height: 24px; border-radius: 4px; background: var(--panel2); }
.punkte i.an { background: color-mix(in srgb, var(--accent) 75%, transparent); }
.punkte i.aus { background: color-mix(in srgb, var(--minus) 35%, transparent); }
.aktionen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.aktion { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 16px; text-align: left; color: var(--text);
  font: inherit; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; min-height: 118px; transition: transform .1s; }
.aktion .ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 22px; background: var(--panel2); }
.aktion b { font-size: 16px; } .aktion span { font-size: 12.5px; color: var(--muted); }
.aktion.breit { grid-column: span 2; min-height: 0; flex-direction: row; align-items: center; gap: 14px;
  background: linear-gradient(135deg, var(--accent2), color-mix(in srgb, var(--accent2) 55%, var(--gold))); color: #fff; border: 0; }
.aktion.breit span { color: rgba(255,255,255,.85); } .aktion.breit .ico { background: rgba(255,255,255,.18); }
.stepper { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.stepper button { width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; font-weight: 800; cursor: pointer; }
.stepper output { min-width: 22px; text-align: center; font-weight: 800; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 9; box-shadow: var(--shadow); max-width: 90vw; }
</style>
</head>
<body>
<header><div class="kopf">
  <div class="logo">$</div>
  <div><h1>MC-Stats</h1><div class="st" id="status">lade …</div></div>
  <button class="k" id="neu" aria-label="Neu laden">↻</button>
</div></header>
<main id="inhalt"><div class="karte leer">Lade Daten …</div></main>
<nav><div class="in" id="nav"></div></nav>
<script>
const SEITEN = [
  ["start", "Start", "M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"],
  ["rang", "Rangliste", "M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"],
  ["aktionen", "Aktionen", "M13 2L4 14h7l-1 8 9-12h-7z"],
  ["verlauf", "Verlauf", "M3 3v18h18M7 15l4-4 3 3 6-7"],
  ["mehr", "Mehr", "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"]
];
let seite = "start", unterseite = "stats", D = null, bereich = 24, totemMenge = 2;
try {
  seite = localStorage.getItem("ks-seite") || seite; unterseite = localStorage.getItem("ks-unter") || unterseite;
  bereich = +localStorage.getItem("ks-bereich") || 24;
} catch (e) {}
if (!SEITEN.some(s => s[0] === seite)) seite = "start";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const zahl = (n, d = 0) => Number(n || 0).toLocaleString("de-DE", { maximumFractionDigits: d });
const geld = n => (n < 0 ? "−" : "") + "$" + zahl(Math.abs(n), Math.abs(n) >= 1000 ? 0 : 2);
const kurzGeld = n => { const a = Math.abs(n), v = n < 0 ? "−" : ""; return v + "$" + (a >= 1e9 ? zahl(a / 1e9, 2) + " Mrd." : a >= 1e6 ? zahl(a / 1e6, 2) + " Mio." : a >= 1e4 ? zahl(a / 1e3, 1) + " Tsd." : zahl(a, 0)); };
const delta = n => `<span class="${n >= 0 ? "plus" : "minus"}">${n >= 0 ? "+" : ""}${kurzGeld(n)}</span>`;
const zeit = s => s ? new Date(s).toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "–";
const uhr = s => new Date(s).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
function vor(s) {
  if (!s) return "";
  const m = Math.round((Date.now() - new Date(s)) / 60000);
  return m < 1 ? "gerade eben" : m < 60 ? `vor ${m} Min.` : m < 1440 ? `vor ${Math.floor(m / 60)} Std. ${m % 60 ? (m % 60) + " Min." : ""}` : `vor ${Math.round(m / 1440)} Tagen`;
}
const STATUS = {
  ok: ["Daten geholt", "gut"], server_aus: ["Server ist aus", "warn"], selbst_online: ["Du warst selbst online", "warn"],
  notaus: ["Notaus", "schlecht"], keine_daten: ["Keine Antwort", "warn"], fehler: ["Fehler", "schlecht"]
};
const ARTEN = { shop_kauf: "Shop-Kauf", verkauf: "Verkauf", auktion_kauf: "Auktion gekauft", auktion_verkauf: "Auktion verkauft",
  ueberweisung_raus: "Überweisung raus", ueberweisung_rein: "Überweisung rein", kredit_zurueck: "Kredit zurückgezahlt" };

// ------------------------------------------------------------------ Laden und Entschlüsseln
function schluessel() {
  let k = location.hash.slice(1);
  try { if (k) localStorage.setItem("ks-key", k); else k = localStorage.getItem("ks-key") || ""; } catch (e) {}
  return k;
}
const b64 = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
async function laden() {
  const k = schluessel();
  if (!k) { $("#status").textContent = "Schlüssel fehlt"; $("#inhalt").innerHTML = `<div class="karte">Öffne die Seite über deinen persönlichen Link (mit # am Ende).</div>`; return; }
  $("#neu").textContent = "…";
  try {
    const r = await fetch("daten.enc?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("Noch keine Daten (" + r.status + ")");
    const roh = new Uint8Array(await r.arrayBuffer());
    const key = await crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"]);
    const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: roh.slice(0, 12) }, key, roh.slice(12));
    D = JSON.parse(new TextDecoder().decode(klar));
    try { localStorage.setItem("ks-cache", JSON.stringify(D)); } catch (e) {}
    zeichne();
  } catch (e) {
    if (!D) try { D = JSON.parse(localStorage.getItem("ks-cache")); } catch (x) {}
    if (D) { zeichne(); $("#status").innerHTML += ` · <span class="warn">offline</span>`; }
    else $("#inhalt").innerHTML = `<div class="karte minus">${esc(e.message || "Falscher Schlüssel")}</div>`;
  }
  $("#neu").textContent = "↻";
}

// ------------------------------------------------------------------ Hilfen für Auswertungen
const ok = () => D.letzterErfolg || {};
const ichName = () => ok().spieler || D.letzterLauf?.spieler || "";
const verlauf = () => (D.verlauf || []).map(p => ({ t: +new Date(p.zeit), v: p.kontostand }));
function wertVor(stunden) {
  const v = verlauf(); if (v.length < 2) return null;
  const grenze = v[v.length - 1].t - stunden * 3600e3;
  let best = null; for (const p of v) if (p.t <= grenze) best = p;
  return best;
}
function proStunde() {
  const v = verlauf(); if (v.length < 2) return null;
  const ende = v[v.length - 1];
  const start = [...v].reverse().find(p => ende.t - p.t >= 2 * 3600e3) || v[0];
  const h = (ende.t - start.t) / 3600e3; if (h < 0.2) return null;
  return (ende.v - start.v) / h;
}
function meinRang() {
  const t = D.topgeld || [], n = ichName().toLowerCase();
  const i = t.findIndex(r => r.name.toLowerCase() === n);
  return i < 0 ? null : { platz: t[i].platz, ueber: t[i - 1], unter: t[i + 1], ich: t[i] };
}

// ------------------------------------------------------------------ Diagramm (eine oder mehrere Linien, antippbar)
function diagramm(id, reihen, opt = {}) {
  const alle = reihen.flatMap(r => r.p); if (alle.length < 2) return `<div class="leer">Kommt, sobald es mehrere Checks gibt.</div>`;
  const B = 640, H = opt.h || 220, L = 8, R = 8, O = 14, U = 22;
  const t0 = Math.min(...alle.map(p => p.t)), t1 = Math.max(...alle.map(p => p.t));
  let lo = Math.min(...alle.map(p => p.v)), hi = Math.max(...alle.map(p => p.v));
  if (hi === lo) { hi += 1; lo -= 1; }
  const X = t => L + (t - t0) / ((t1 - t0) || 1) * (B - L - R), Y = v => O + (1 - (v - lo) / (hi - lo)) * (H - O - U);
  let s = "";
  for (let i = 0; i <= 3; i++) { const y = O + i * (H - O - U) / 3; s += `<line x1="${L}" x2="${B - R}" y1="${y}" y2="${y}" stroke="var(--line)"/>`; }
  reihen.forEach((r, i) => {
    if (r.p.length < 1) return;
    const d = r.p.map((p, j) => (j ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
    if (reihen.length === 1) s += `<path d="${d} L${X(r.p[r.p.length - 1].t).toFixed(1)} ${H - U} L${X(r.p[0].t).toFixed(1)} ${H - U}Z" fill="${r.f}" opacity=".12"/>`;
    s += `<path d="${d}" fill="none" stroke="${r.f}" stroke-width="${r.dick ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  s += `<text x="${L}" y="11">${kurzGeld(hi)}</text><text x="${L}" y="${H - U - 4}">${kurzGeld(lo)}</text>`;
  s += `<text x="${L}" y="${H - 5}">${zeit(t0)}</text><text x="${B - R}" y="${H - 5}" text-anchor="end">${zeit(t1)}</text>`;
  s += `<line id="${id}-m" y1="${O}" y2="${H - U}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>`;
  window["_" + id] = { reihen, X, B, t0, t1, L, R };
  return `<svg class="graf" id="${id}" viewBox="0 0 ${B} ${H}" role="img" aria-label="${esc(opt.titel || "Verlauf")}">${s}</svg><div class="tip" id="${id}-t">Tippe auf die Kurve für Werte</div>`;
}
function antippbar(id) {
  const el = document.getElementById(id); if (!el) return;
  const g = window["_" + id];
  const zeig = ev => {
    const r = el.getBoundingClientRect(), x = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * g.B;
    const t = g.t0 + (x - g.L) / (g.B - g.L - g.R) * (g.t1 - g.t0);
    const teile = g.reihen.map(rr => { let b = rr.p[0]; for (const p of rr.p) if (Math.abs(p.t - t) < Math.abs(b.t - t)) b = p; return { rr, b }; });
    const m = document.getElementById(id + "-m"); const xx = g.X(teile[0].b.t);
    m.setAttribute("x1", xx); m.setAttribute("x2", xx); m.setAttribute("opacity", 1);
    document.getElementById(id + "-t").innerHTML = zeit(teile[0].b.t) + " · " +
      teile.map(({ rr, b }) => `<b style="color:${rr.f}">${g.reihen.length > 1 ? esc(rr.n) + " " : ""}${geld(b.v)}</b>`).join(" · ");
  };
  el.addEventListener("click", zeig); el.addEventListener("touchmove", zeig, { passive: true });
}

// ------------------------------------------------------------------ Seiten
function start() {
  const o = ok(), l = D.letzterLauf || {}, v = verlauf(), rg = meinRang(), ps = proStunde();
  const v1 = wertVor(1), v24 = wertVor(24), jetzt = o.kontostand;
  const naechster = l.zeit ? new Date(+new Date(l.zeit) + 15 * 60e3) : null;
  let h = `<div class="karte held"><div class="t">Kontostand · ${esc(ichName())}</div>
    <div class="gross gold">${jetzt != null ? geld(jetzt) : "?"}</div>
    <div class="klein">${o.zeit ? "Stand " + zeit(o.zeit) + " · " + vor(o.zeit) : "noch kein erfolgreicher Check"}</div>
    <div class="chips">
      ${v1 && jetzt != null ? `<span class="chip">1 Std. ${delta(jetzt - v1.v)}</span>` : ""}
      ${v24 && jetzt != null ? `<span class="chip">24 Std. ${delta(jetzt - v24.v)}</span>` : ""}
      ${ps != null ? `<span class="chip">≈ ${delta(ps)} / Std.</span>` : ""}
      ${rg ? `<span class="chip">🏆 Platz ${rg.platz}</span>` : ""}
      ${D.inventar ? `<span class="chip">🗿 ${zahl(D.inventar.totem_of_undying || 0)} Totems</span>` : ""}
    </div>
    ${v.length > 1 ? diagramm("mini", [{ n: "Du", f: "var(--gold)", p: v.slice(-96), dick: 1 }], { h: 120, titel: "Kontostand" }) : ""}</div>`;
  if (rg) {
    h += `<div class="raster">

const AKTIONEN = {

const b64url = a => btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
async function kanal() {
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("befehle:" + schluessel())));
  return "mcs-" + [...h].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 24);
}
async function sende(befehl, anzahl = 1) {
  const key = await crypto.subtle.importKey("raw", b64(schluessel()), "AES-GCM", false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const klar = new TextEncoder().encode(JSON.stringify({ befehl, anzahl, zeit: new Date().toISOString() }));
  const geheim = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, klar));
  const alles = new Uint8Array(12 + geheim.length); alles.set(iv); alles.set(geheim, 12);
  const r = await fetch("https://ntfy.sh/" + await kanal(), { method: "POST", body: b64url(alles) });
  if (!r.ok) throw new Error("Senden fehlgeschlagen (" + r.status + ")");
  const g = gesendet(); g.push({ befehl, anzahl, zeit: new Date().toISOString() });
  try { localStorage.setItem("ks-gesendet", JSON.stringify(g.slice(-20))); } catch (e) {}
}
function gesendet() { try { return JSON.parse(localStorage.getItem("ks-gesendet")) || []; } catch (e) { return []; } }
function toast(t) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
async function ausloesen(liste) {
  try {
    for (const [b, n] of liste) await sende(b, n);
    const l = D.letzterLauf || {}, naechster = l.zeit ? new Date(+new Date(l.zeit) + 15 * 60e3) : null;
    toast("Gesendet ✓ Der Bot macht es beim nächsten Check" + (naechster && naechster > Date.now() ? " (etwa " + uhr(naechster) + " Uhr)" : ""));
    zeichne();
  } catch (e) { toast("⚠ " + e.message); }
}

  h += `<div class="raster">
    <div class="karte"><div class="t">Totems</div><div class="mittel">🗿 ${zahl(inv.totem_of_undying || 0)}</div><div class="klein">${zweite === "totem_of_undying" ? "eins in der zweiten Hand ✓" : "keins in der zweiten Hand"}</div></div>
    <div class="karte"><div class="t">Essen</div><div class="mittel">🍗 ${zahl(essenZahl)}</div><div class="klein">Hunger ${D.letzterErfolg?.essen != null ? zahl(D.letzterErfolg.essen / 2, 1) + " / 10" : "?"}</div></div>
    <div class="karte"><div class="t">Bausteine</div><div class="mittel">🧱 ${zahl(steine)}</div><div class="klein">zum Einbauen (10 nötig)</div></div>
    <div class="karte"><div class="t">Umgebung</div><div class="mittel" style="font-size:17px">${gefahr.length ? "⚠ " + gefahr.length + " Monster" : "✓ ruhig"}</div><div class="klein">${esc(gefahr.slice(0, 3).join(", "))}</div></div></div>`;
  if (!D.inventar) h += `<div class="karte klein">Inventar und Umgebung erscheinen nach dem nächsten Check, wenn der Server an ist.</div>`;
  if (unterwegs.length) h += `<div class="karte"><div class="t">Unterwegs zum Bot</div>${unterwegs.map(g => `<div class="zeile"><span>${AKTIONEN[g.befehl]?.[0] || ""} ${AKTIONEN[g.befehl]?.[1] || g.befehl}${g.befehl === "kaufen" ? " (" + g.anzahl + ")" : ""}</span><span class="klein">${vor(g.zeit)}</span></div>`).join("")}
    <div class="klein" style="margin-top:6px">Wird beim nächsten Check ausgeführt, sobald der Server an ist.</div></div>`;
  h += `<div class="karte"><div class="t">Vom Bot erledigt</div>${auftr.length ? auftr.slice(0, 12).map(a => `<div class="zeile"><span>${AKTIONEN[a.art]?.[0] || ""} ${AKTIONEN[a.art]?.[1] || a.art}<div class="klein">${esc(a.ergebnis || (a.status === "offen" ? "wartet, bis der Server an ist" : ""))}</div></span>
      <span><span class="chip ${a.status === "erledigt" ? "gut" : a.status === "fehler" ? "schlecht" : "warn"}">${a.status}</span></span></div>`).join("") : `<div class="leer">Noch nichts.</div>`}</div>`;
  h += `<div class="karte klein">🛡️ Sicherheit: Bekommt der Bot Schaden, geht er sofort raus, wartet kurz und kommt höchstens zweimal wieder, nie mit weniger als 3 Herzen. Bist du selbst online, joint er nicht.</div>`;
  if (D.shopFenster) h += `<div class="karte"><details><summary>Shop-Fenster (zur Kontrolle)</summary>${D.shopFenster.map(f => `<p><b>${esc(f.titel)}</b><br>${f.items.map(i => `<span class="chip">${esc(i.name || i.item)}</span>`).join(" ")}</p>`).join("")}</details></div>`;
  return h;
}
function mehr() {
  const teile = [["stats", "Statistik"], ["server", "Server"], ["geschichte", "Geschichte"]];
  return `<div class="segment">${teile.map(([id, n]) => `<button data-u="${id}" class="${id === unterseite ? "aktiv" : ""}">${n}</button>`).join("")}</div>` +
    ({ stats, server, geschichte }[unterseite] || stats)();
}

// ------------------------------------------------------------------ Rahmen
function nav() {
  $("#nav").innerHTML = SEITEN.map(([id, n, d]) => `<button data-s="${id}" class="${id === seite ? "aktiv" : ""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>${n}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => { seite = b.dataset.s; try { localStorage.setItem("ks-seite", seite); } catch (e) {} nav(); zeichne(); scrollTo(0, 0); });
}
function zeichne() {
  if (!D) return;
  const l = D.letzterLauf || {}, [st, cls] = STATUS[l.status] || [l.status || "?", ""];
  $("#status").innerHTML = `Check ${vor(l.zeit)} · <span class="${cls === "gut" ? "plus" : cls === "schlecht" ? "minus" : "warn"}">${st}</span>`;
  const f = { start, rang, aktionen, verlauf: verlaufSeite, mehr }[seite] || start;
  $("#inhalt").innerHTML = f();
  ["mini", "rennen", "haupt"].forEach(antippbar);
  document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { bereich = +b.dataset.b; try { localStorage.setItem("ks-bereich", bereich); } catch (e) {} zeichne(); });
  document.querySelectorAll("[data-u]").forEach(b => b.onclick = () => { unterseite = b.dataset.u; try { localStorage.setItem("ks-unter", unterseite); } catch (e) {} zeichne(); });
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { totemMenge = Math.max(1, Math.min(16, totemMenge + +b.dataset.m)); zeichne(); });
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => ausloesen([[b.dataset.a, b.dataset.a === "kaufen" ? totemMenge : 1]]));
  const alles = document.querySelector("[data-alles]");
  if (alles) alles.onclick = () => ausloesen([["kaufen", totemMenge], ["totem", 1], ["essen", 1], ["einbauen", 1]]);
}
$("#neu").onclick = laden;
nav();
try { D = JSON.parse(localStorage.getItem("ks-cache")); if (D) zeichne(); } catch (e) {}
laden();
setInterval(laden, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) laden(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
